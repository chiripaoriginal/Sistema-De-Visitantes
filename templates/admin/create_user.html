<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Usuario</title>
    <style>
        /* (Tu CSS existente aquí) */
        .camera-section, .photo-preview-section { margin-top: 15px; text-align: center; }
        video, canvas, .photo-preview { border: 1px solid #ccc; border-radius: 5px; max-width: 100%; height: auto; }
        canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crear Nuevo Usuario</h1>
        
        <form method="post">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <label for="role">Rol:</label>
            <select id="role" name="role" required>
                <option value="empleado">Empleado</option>
                <option value="supervisor">Supervisor</option>
                <option value="administrador">Administrador</option>
            </select>

            <div class="camera-section">
                <h3>Foto de Perfil (Opcional)</h3>
                <button type="button" id="startCameraButton">Iniciar Cámara</button>
                <video id="video" autoplay style="display:none;"></video>
                <canvas id="canvas"></canvas>
                <button type="button" id="takePictureButton" style="display:none;">Tomar Foto</button>
                <button type="button" id="retakePictureButton" style="display:none;">Volver a Tomar</button>
            </div>
            
            <div class="photo-preview-section" id="photoPreviewBox" style="display:none;">
                <h4>Vista Previa de la Foto</h4>
                <img id="capturedPhotoPreview" class="photo-preview" src="#" alt="Foto capturada">
            </div>

            <input type="hidden" name="photo_data_url" id="photoDataUrlInput">
            
            <button type="submit">Crear Usuario</button>
        </form>
        <a href="{{ url_for('manage_users') }}" class="back-link">Volver a Administrar Usuarios</a>
    </div>

    <script>
        // (El mismo script de cámara que usas en register.html y edit_user.html)
        const startCameraButton = document.getElementById('startCameraButton');
        const video = document.getElementById('video');
        const takePictureButton = document.getElementById('takePictureButton');
        const retakePictureButton = document.getElementById('retakePictureButton');
        const canvas = document.getElementById('canvas');
        const photoDataUrlInput = document.getElementById('photoDataUrlInput');
        const photoPreviewBox = document.getElementById('photoPreviewBox');
        const capturedPhotoPreview = document.getElementById('capturedPhotoPreview');
        let stream;

        startCameraButton.addEventListener('click', async () => {
            if (stream) { stream.getTracks().forEach(track => track.stop()); }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block';
                startCameraButton.style.display = 'none';
                takePictureButton.style.display = 'inline-block';
                retakePictureButton.style.display = 'none';
                photoPreviewBox.style.display = 'none';
                canvas.style.display = 'none';
            } catch (err) {
                alert('No se pudo acceder a la cámara.');
            }
        });

        takePictureButton.addEventListener('click', () => {
            if (stream) {
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                video.style.display = 'none';
                const dataURL = canvas.toDataURL('image/png');
                photoDataUrlInput.value = dataURL;
                capturedPhotoPreview.src = dataURL;
                photoPreviewBox.style.display = 'block';
                takePictureButton.style.display = 'none';
                retakePictureButton.style.display = 'inline-block';
            }
        });

        retakePictureButton.addEventListener('click', () => {
            startCameraButton.click();
        });
    </script>
</body>
</html>
